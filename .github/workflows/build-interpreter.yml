# Builds the Linux BornoCode interpreter binary and commits it to the repo so
# Vercel (Linux) can run it. Runs on push to main and on manual dispatch.
name: Build interpreter (Linux)

on:
  push:
    branches: [main]
    paths:
      - "interpreter/bornocode.cpp"
      - "interpreter/bornocode.h"
      - ".github/workflows/build-interpreter.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build interpreter
        run: |
          g++ -std=c++17 -O2 -static -o interpreter/bin/bornocode \
            interpreter/bornocode.cpp

      - name: Smoke test
        run: |
          printf 'dekhao("ok");\n' > /tmp/smoke.bc
          ./interpreter/bin/bornocode /tmp/smoke.bc

      - name: Commit binary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add interpreter/bin/bornocode
          git diff --cached --quiet || \
            git commit -m "chore: rebuild linux interpreter binary [skip ci]"
          git push
